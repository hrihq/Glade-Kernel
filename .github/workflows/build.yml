name: Build Glade Kernel

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP-Clang'
        type: choice
        options:
          - AOSP-Clang
          - Neutron-Clang

permissions:
  contents: write

jobs:
  Reforging:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 1

    - name: ⏰ Prepare timezone
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          cpio \
          flex \
          bison \
          git \
          python-is-python3 \
          tar \
          aria2 \
          perl \
          wget \
          curl \
          lz4 \
          libssl-dev \
          libelf-dev \
          dwarves \
          zip \
          zstd

    - name: ⚙️ Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
        echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

    - name: 🔧 Setup Compiler
      shell: bash
      run: |
        set -e

        mkdir -p clang

        if [[ "${{ github.event.inputs.compiler }}" == "Neutron-Clang" ]]; then

          echo "Using Neutron Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest |
            grep "browser_download_url" |
            grep "neutron-clang" |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o neutron-clang.tar.zst
          tar -C clang -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

        else

          echo "Using AOSP Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest |
            grep "browser_download_url" |
            grep -E 'clang-.*\.tar\.gz' |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o clang.tar.gz
          tar -C clang -xf clang.tar.gz
          rm -f clang.tar.gz

        fi

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"

        echo
        echo "Compiler:"
        "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
        "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

    - name: 🛠️ Build Kernel
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=hrihq
        export KBUILD_BUILD_HOST=LineageOS

        export PATH="$CLANG_PATH/bin:$PATH"

        export LLVM=1
        export LLVM_IAS=1

        export CC=clang
        export LD=ld.lld

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

        echo "========================================="
        echo "       Glade Kernel Compilation"
        echo "========================================="
        echo "Build type : ${{ github.event.inputs.build_type }}"
        echo "Compiler   : ${{ github.event.inputs.compiler }}"
        echo "Date       : $BUILD_DATE"
        echo "Jobs       : $(nproc --all)"
        echo
        clang --version | head -n1
        echo "========================================="

        make O=out ARCH=arm64 sweet_defconfig

        make \
          -j"$(nproc --all)" \
          O=out \
          ARCH=arm64

        cp out/.config out/sweet_defconfig.txt

    - name: ✅ Verify Kernel Build
      shell: bash
      run: |
        set -e

        KERNEL="out/arch/arm64/boot/Image.gz"
        DTBO="out/arch/arm64/boot/dtbo.img"
        DTB="out/arch/arm64/boot/dtb.img"

        failed=0

        for file in "$KERNEL" "$DTBO" "$DTB"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing: $file"
            failed=1
          else
            echo "✅ Found: $file"
            ls -lh "$file"
          fi
        done

        if [[ "$failed" -ne 0 ]]; then
          echo "Kernel compilation failed."
          exit 1
        fi

    - name: 💾 Upload configs
      uses: actions/upload-artifact@v7
      with:
        name: configs-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt

    - name: 📂 Clone AnyKernel3 & Zip
      shell: bash
      run: |
        set -e

        git clone \
          --depth=1 \
          https://github.com/hrihq/Glade-AnyKernel3.git \
          AnyKernel3

        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img

        cd AnyKernel3

        # The manager app looks for these two fixed names on the release, so
        # both variants are always produced regardless of how the run started.
        REL_TAG="$GITHUB_REF_NAME"

        zip -r9 "../Glade-Kernel-$REL_TAG-OEM.zip" . -x ".git/*"
        zip -r9 "../Glade-Kernel-$REL_TAG.zip"     . -x ".git/*"

        # Keep the timestamped name too for manual runs.
        zip -r9 "../Glade-$REL_TAG-$BUILD_TIME.zip" . -x ".git/*"

        echo "TAG=$REL_TAG" >> "$GITHUB_ENV"
        ls -lh ../*.zip

    - name: 📤 Upload Flashable Zips
      uses: actions/upload-artifact@v7
      with:
        name: Glade-Kernel-${{ github.ref_name }}
        path: |
          Glade-Kernel-*.zip

    - name: 🚀 Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN:[REDACTED]
      run: |
        set -e

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh not available, skipping release publish"
          exit 0
        fi

        TITLE="Glade Kernel ${{ github.ref_name }}"
        NOTES=$(cat <<'EOF'
        ## Glade Kernel ${{ github.ref_name }}

        **Fast-charge thermal hold raised from 48°C to 52°C.** The JEITA
        fast-charge ladder no longer drops the cell to 2.4A (~38W) the moment
        the pack reaches 48°C — it holds the full 12.2A tier through the warm
        band. The 58°C hard shutdown and the cold limits are unchanged.

        Flash via recovery (AnyKernel3). Reboot afterwards.
        EOF
        )

        gh release create "$GITHUB_REF_NAME" \
          --title "$TITLE" \
          --notes "$NOTES" \
          "Glade-Kernel-$GITHUB_REF_NAME-OEM.zip" \
          "Glade-Kernel-$GITHUB_REF_NAME.zip"