name: Build Glade Kernel

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP-Clang'
        type: choice
        options:
          - AOSP-Clang
          - Neutron-Clang

permissions:
  contents: write

jobs:
  Reforging:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 1

    - name: ⏰ Prepare timezone
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          cpio \
          flex \
          bison \
          git \
          python-is-python3 \
          tar \
          aria2 \
          perl \
          wget \
          curl \
          lz4 \
          libssl-dev \
          libelf-dev \
          dwarves \
          zip \
          zstd

    - name: ⚙️ Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
        echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

    - name: 🔧 Setup Compiler
      shell: bash
      run: |
        set -e

        mkdir -p clang

        if [[ "${{ github.event.inputs.compiler }}" == "Neutron-Clang" ]]; then

          echo "Using Neutron Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest |
            grep "browser_download_url" |
            grep "neutron-clang" |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o neutron-clang.tar.zst
          tar -C clang -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

        else

          echo "Using AOSP Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest |
            grep "browser_download_url" |
            grep -E 'clang-.*\.tar\.gz' |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o clang.tar.gz
          tar -C clang -xf clang.tar.gz
          rm -f clang.tar.gz

        fi

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"

        echo
        echo "Compiler:"
        "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
        "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

    - name: 🛠️ Build Kernel
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=hrihq
        export KBUILD_BUILD_HOST=LineageOS

        export PATH="$CLANG_PATH/bin:$PATH"

        export LLVM=1
        export LLVM_IAS=1

        export CC=clang
        export LD=ld.lld

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

        echo "========================================="
        echo "       Glade Kernel Compilation"
        echo "========================================="
        echo "Build type : ${{ github.event.inputs.build_type }}"
        echo "Compiler   : $KBUILD_COMPILER_STRING"
        echo "Date       : $BUILD_DATE"
        echo "Jobs       : $(nproc --all)"
        echo
        clang --version | head -n1
        echo "========================================="

        make O=out ARCH=arm64 sweet_defconfig

        make \
          -j"$(nproc --all)" \
          O=out \
          ARCH=arm64

        cp out/.config out/sweet_defconfig.txt

    - name: ✅ Verify Kernel Build
      shell: bash
      run: |
        set -e

        KERNEL="out/arch/arm64/boot/Image.gz"
        DTBO="out/arch/arm64/boot/dtbo.img"
        DTB="out/arch/arm64/boot/dtb.img"

        failed=0

        for file in "$KERNEL" "$DTBO" "$DTB"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing: $file"
            failed=1
          else
            echo "✅ Found: $file"
            ls -lh "$file"
          fi
        done

        if [[ "$failed" -ne 0 ]]; then
          echo "Kernel compilation failed."
          exit 1
        fi

    - name: 💾 Upload configs
      uses: actions/upload-artifact@v5
      with:
        name: configs-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt

    - name: 📂 Clone AnyKernel3 & Zip
      shell: bash
      run: |
        set -e

        git clone \
          --depth=1 \
          https://github.com/hrihq/Glade-AnyKernel3.git \
          AnyKernel3

        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img

        cd AnyKernel3

        # The manager app resolves these two fixed asset names on the release.
        REL_TAG="$GITHUB_REF_NAME"

        zip -r9 "../Glade-Kernel-$REL_TAG-OEM.zip" . -x ".git/*"
        zip -r9 "../Glade-Kernel-$REL_TAG.zip"     . -x ".git/*"
        zip -r9 "../Glade-$REL_TAG-$BUILD_TIME.zip" . -x ".git/*"

        ls -lh ../*.zip

    - name: 📤 Upload Flashable Zips
      uses: actions/upload-artifact@v5
      with:
        name: Glade-Kernel-${{ github.ref_name }}
        path: |
          Glade-Kernel-*.zip

    - name: 🚀 Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh CLI not available; skipping release publish"
          exit 0
        fi

        # Release notes live here so every tag publishes the same structured
        # changelog the v1.11 release used. Quoted heredoc delimiter: the note
        # contains backticks and would otherwise be command-substituted.
        cat > release-notes.md <<'GLADE_NOTES'
        # Glade Kernel v1.13 — Charge Thermal Fix

        ## What's Changed

        **Fixed the JEITA ladder mismatch shipped in v1.12** that let the charger hold full fast-charge current against a reduced voltage ceiling. This is the fix for the "phone runs hot / reboots while charging" reports on v1.12.

        ### The problem

        v1.12 raised the fast-charge **current** (FCC) ladder hold from 48 °C to 52 °C but left the **voltage** (FV) ladder stepping down at 48 °C. Between 48.1 °C and 52 °C the pack was therefore charged at the full **12.2 A** while float voltage was already clamped to **4.10 V** — a ceiling meant for the 2.4 A tier.

        Driving 12.2 A into a 4.10 V ceiling dumps the difference as heat (≈4.6 W) in the band where the pack is already warm, so temperature climbs instead of settling. On a warm start it can reach the 58 °C shutdown mid-charge, which looks like the phone rebooting on its own.

        ### The fix

        The FV ladder boundary now moves together with the FCC ladder:

        | Battery temp | Charge current | Float voltage |
        | --- | --- | --- |
        | 15.1 – 52.0 °C | 12.2 A | 4.48 V |
        | 52.1 – 60.0 °C | 2.4 A | 4.10 V |

        Both K6 battery profiles are aligned the same way:

        | Profile | Before (FV) | After (FV) |
        | --- | --- | --- |
        | K6 NVT 5020 mAh | `151 480 4480000` · `481 600 4100000` | `151 520 4480000` · `521 600 4100000` |
        | K6 Sunwoda 5020 mAh | `151 480 4480000` · `481 600 4100000` | `151 520 4480000` · `521 600 4100000` |

        ### What is *not* changed

        - 58 °C hard shutdown — unchanged
        - cold limits — unchanged
        - `BATT_CP_WARM` charge-pump threshold (450) — unchanged
        - FCC ladder (`151 520 12200000` · `521 600 2400000`) — unchanged from v1.12
        - no gaming/performance changes

        ### Files

        - `arch/arm64/boot/dts/qcom/xiaomi/sweet/batterydata-K6-nvt-5020mah.dtsi`
        - `arch/arm64/boot/dts/qcom/xiaomi/sweet/batterydata-K6-sunwoda-5020mah.dtsi`

        ## Flash

        Flash the zip in recovery, then reboot. The installer is **AnyKernel3 / systemless** — it patches your existing boot image, so it works on MIUI/OEM and AOSP alike (device `sweet` / `sweet_k6a` / `sweet2`, Android 11–17). Both assets (`-OEM.zip` and `.zip`) are built from the same AnyKernel3 tree; either works.

        ## Notes

        - Flashed v1.12 and saw the phone run hot or reboot while charging? This build is the fix for exactly that.
        - CI: builds run automatically on `v*` tags and publish the release themselves.
        GLADE_NOTES

        # The manager app decides "already up to date" by matching the running
        # kernel's git-describe hash against a hash in this body
        # (GladeDetection.releaseBodyMatches). Hand-written notes forgot it in
        # v1.11 and every surface nagged "update available" forever, so the
        # build now appends it from the kernel it just produced — no release
        # can ship without it.
        VERSION_STR="$(cat out/include/config/kernel.release 2>/dev/null || true)"
        if [ -z "$VERSION_STR" ]; then
          VERSION_STR="$(make -s O=out ARCH=arm64 kernelrelease 2>/dev/null || true)"
        fi
        COMMIT="$(printf '%s' "$VERSION_STR" | sed -n 's/.*-g\([0-9a-f]\{7,\}\).*/\1/p')"

        if [ -n "$COMMIT" ]; then
          printf '\n---\n**Build:** `%s`\nCommit: %s\n' "$VERSION_STR" "$COMMIT" >> release-notes.md
          echo "release notes carry Commit: $COMMIT"
        else
          echo "::warning::no -g<hash> in kernel release '$VERSION_STR' — the manager app cannot match this release"
        fi

        gh release create "$GITHUB_REF_NAME" \
          --title "Glade Kernel $GITHUB_REF_NAME" \
          --notes-file release-notes.md \
          "Glade-Kernel-$GITHUB_REF_NAME-OEM.zip" \
          "Glade-Kernel-$GITHUB_REF_NAME.zip"
